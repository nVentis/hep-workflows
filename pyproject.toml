[project]
name = "hep_workflows"
dynamic = ["version"]
dependencies = [
    "law==0.1.20",
    "luigi==3.5.1",
    "numpy",
    "python-dateutil",
    "tqdm==4.66.3"
]

[project.optional-dependencies]
test = ["pytest", "uproot"]

[tool.pytest.ini_options]
testpaths = ["hep_workflows/tests"]
markers = [
    "integration: runs law in the software environment of setup.sh (key4hep from CVMFS, Python environment); select with -m integration",
]
# the unit tests only need the Python packages; run the integration tests explicitly
addopts = "-m 'not integration'"

[tool.setuptools.packages.find]
include = ["hep_workflows*"]

[tool.setuptools.package-data]
hep_workflows = ["*.sh", "bin/*", "resources/**/*"]